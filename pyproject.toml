[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "suschain-kgc"
version = "0.1.0"
description = "Extension of Peeris, Baryannis & Papadakis (2026) supply-chain KG completion paper"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
